<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>توصيات العملات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal&display=swap" rel="stylesheet">

<style>
  body {
    background: #f9f9f9;
    color: #333;
    font-family: 'Tajawal', sans-serif;
    margin: 0;
    padding: 0;
  }
  header {
    background: #ffffff;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #ddd;
  }
  header img {
    height: 60px;
  }
  h1 {
    color: #1a73e8;
    margin-top: 10px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    border: 1px solid #eee;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .card h2 {
    color: #1a73e8;
    font-size: 18px;
    margin: 0 0 10px;
  }
  .suggestion {
    background: #e6f4ea;
    color: #137333;
    padding: 5px 10px;
    border-radius: 5px;
    margin-top: 10px;
    display: inline-block;
    font-weight: bold;
  }
  .details {
    font-size: 14px;
    margin-top: 10px;
  }
</style>

</head>
<body>
  <header>
    <img src="https://blogger.googleusercontent.com/img/logo.png" alt="الشعار">
    <h1>ياسر كريبتو</h1>
  </header>

  <div class="grid">
    <div class="card">
      <h2>BTCUSDT</h2>
      <div class="details">
        السعر الحالي: $64000<br>
        مقاومة: $66000<br>
        الهدف 1: $68000<br>
        الهدف 2: $70000
      </div>
      <div class="suggestion">✅ توصية شراء</div>
    </div>
  </div>
</body>
</html>
