<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>📊 توصيات العملات الذكية (موثوقة فقط)</title>
  <script src="https://cdn.jsdelivr.net/npm/technicalindicators@3.1.1/dist/browser.js"></script>
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: #0a192f;
      color: #e6f1ff;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      background: #112240;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .card h2 { margin: 0 0 10px; font-size: 20px; }
    .suggestion {
      margin-top: 10px;
      padding: 6px;
      border-radius: 6px;
      background: #003c2c;
      color: #00e676;
      font-weight: bold;
    }
    .details {
      font-size: 14px;
      margin-top: 8px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>📈 توصيات العملات الذكية (فلترة مدعومة + تحليل محلي)</h1>
  <div class="grid" id="cardsGrid">جاري التحليل...</div>

  <script>
    async function getSupportedSymbols() {
      const info = await fetch("https://api.binance.com/api/v3/exchangeInfo").then(res => res.json());
      return info.symbols
        .filter(s => s.symbol.endsWith("USDT") && s.status === "TRADING")
        .map(s => s.symbol);
    }

    async function fetchTopMovers(supported) {
      const res = await fetch("https://api.binance.com/api/v3/ticker/24hr");
      const data = await res.json();

      const filtered = data.filter(c =>
        supported.includes(c.symbol) &&
        parseFloat(c.priceChangePercent) > 5 &&
        parseFloat(c.lastPrice) > 0 &&
        !["BUSD", "USDC", "TUSD", "USDT", "FDUSD", "DAI"].some(stable => c.symbol.startsWith(stable))
      );

      return filtered
        .sort((a, b) => parseFloat(b.priceChangePercent) - parseFloat(a.priceChangePercent))
        .slice(0, 30)
        .map(c => c.symbol);
    }

    async function fetchCandles(symbol) {
      const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=100`;
      const res = await fetch(url);
      const data = await res.json();
      return data.map(c => parseFloat(c[4])); // close prices
    }

    function analyze(symbol, closes) {
      if (!closes || closes.length < 50) return;

      const rsi = window.RSI.calculate({ values: closes, period: 14 });
      const macd = window.MACD.calculate({
        values: closes,
        fastPeriod: 12,
        slowPeriod: 26,
        signalPeriod: 9,
        SimpleMAOscillator: false,
        SimpleMASignal: false
      });

      const latestRSI = rsi[rsi.length - 1];
      const latestMACD = macd[macd.length - 1];
      const price = closes[closes.length - 1];

      const isRSIGood = latestRSI >= 40 && latestRSI <= 70;
      const isMACDPositive = latestMACD.MACD > latestMACD.signal;

      if (isRSIGood && isMACDPositive) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h2>${symbol}</h2>
          <p>RSI: ${latestRSI.toFixed(2)}</p>
          <p>MACD: ${latestMACD.MACD.toFixed(3)} / Signal: ${latestMACD.signal.toFixed(3)}</p>
          <div class="details">
            <strong>السعر الحالي:</strong> $${price.toFixed(4)}<br>
            <strong>مقاومة:</strong> $${(price * 1.03).toFixed(4)}<br>
            <strong>الهدف 1:</strong> $${(price * 1.05).toFixed(4)}<br>
            <strong>الهدف 2:</strong> $${(price * 1.10).toFixed(4)}
          </div>
          <div class="suggestion">✅ توصية شراء</div>
        `;
        document.getElementById("cardsGrid").appendChild(card);
      }
    }

    async function runFullAnalysis() {
      document.getElementById("cardsGrid").innerHTML = "جاري التحليل...";
      const supported = await getSupportedSymbols();
      const symbols = await fetchTopMovers(supported);
      console.log("🧠 العملات المحددة:", symbols);

      for (let symbol of symbols) {
        try {
          const closes = await fetchCandles(symbol);
          analyze(symbol, closes);
        } catch (err) {
          console.warn("❌", symbol, err.message);
        }
      }
    }

    window.addEventListener("load", runFullAnalysis);
  </script>
</body>
</html>
