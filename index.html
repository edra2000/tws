<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 توصيات العملات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: #0a192f;
      color: #e6f1ff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      background: #112240;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .card h2 {
      font-size: 20px;
      margin: 0 0 10px;
    }
    .suggestion {
      margin-top: 10px;
      padding: 6px;
      border-radius: 6px;
      background: #003c2c;
      color: #00e676;
      font-weight: bold;
    }
    .no-suggestion {
      margin-top: 10px;
      color: #ccc;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>📈 توصيات العملات الذكية (RSI + MACD)</h1>
  <div class="grid" id="cardsGrid">
    <div>جاري تحميل التوصيات...</div>
  </div>

  <script>
    const apiKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjbHVlIjoiNjgxM2Q4NWU4MDZmZjE2NTFlNjM2ZTAxIiwiaWF0IjoxNzQ2MTMxODg4LCJleHAiOjMzMjUwNTk1ODg4fQ.oiEizjwC-mbN2WLAlyo5i2Sjqin9-IOFFUkAKrP7YNM";
    const symbols = ["BTC", "ETH", "XRP"]; // العملات المدعومة في الخطة المجانية فقط

    async function fetchRecommendation(symbol) {
      const interval = "1h";
      const rsiUrl = `https://api.taapi.io/rsi?secret=${apiKey}&exchange=binance&symbol=${symbol}/USD&interval=${interval}`;
      const macdUrl = `https://api.taapi.io/macd?secret=${apiKey}&exchange=binance&symbol=${symbol}/USD&interval=${interval}`;

      try {
        const [rsiRes, macdRes] = await Promise.all([fetch(rsiUrl), fetch(macdUrl)]);
        const rsiData = await rsiRes.json();
        const macdData = await macdRes.json();

        const rsi = parseFloat(rsiData.value).toFixed(2);
        const macd = parseFloat(macdData.valueMACD).toFixed(3);
        const signal = parseFloat(macdData.valueSignal).toFixed(3);

        const isRSIGood = rsi >= 45 && rsi <= 60;
        const isMACDPositive = parseFloat(macd) > parseFloat(signal);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h2>${symbol}/USD</h2>
          <p>RSI: ${rsi}</p>
          <p>MACD: ${macd} / Signal: ${signal}</p>
          ${isRSIGood && isMACDPositive ? '<div class="suggestion">✅ توصية شراء</div>' : '<div class="no-suggestion">❌ لا توجد توصية حالياً</div>'}
        `;
        document.getElementById("cardsGrid").appendChild(card);
      } catch (error) {
        console.error("❌ خطأ أثناء جلب البيانات:", error);
      }
    }

    document.getElementById("cardsGrid").innerHTML = "";
    symbols.forEach(fetchRecommendation);
  </script>
</body>
</html>
