<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ياسر كريبتو | التوصيات</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ألوان الموقع الرسمي */
    :root {
      --primary-blue: #1a73e8;
      --dark-blue: #0d47a1;
      --white: #ffffff;
      --light-gray: #f8f9fa;
      --medium-gray: #e0e0e0;
      --dark-gray: #333333;
      --green: #34a853;
      --red: #ea4335;
      --yellow: #fbbc05;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }
    
    body {
      background-color: var(--white);
      color: var(--dark-gray);
      line-height: 1.6;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
    }
    
    /* Header - مطابق للتصميم الأصلي */
    header {
      background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
      padding: 15px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
    }
    
    .logo-img {
      height: 50px;
      margin-left: 10px;
    }
    
    .logo-text {
      color: var(--white);
      font-size: 1.8rem;
      font-weight: 700;
    }
    
    .last-update {
      color: rgba(255,255,255,0.9);
      font-size: 0.9rem;
    }
    
    /* Main Content */
    .main-content {
      padding: 30px 0;
      background-color: var(--white);
    }
    
    .section-title {
      font-size: 1.8rem;
      color: var(--primary-blue);
      margin-bottom: 25px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary-blue);
    }
    
    /* Crypto Cards - مطابقة للتصميم الأصلي */
    .crypto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
    }
    
    .crypto-card {
      background: var(--white);
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border: 1px solid var(--medium-gray);
      transition: all 0.3s ease;
    }
    
    .crypto-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    
    .card-header {
      background: var(--primary-blue);
      color: var(--white);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 10px 10px 0 0;
    }
    
    .coin-name {
      font-size: 1.3rem;
      font-weight: 700;
    }
    
    .coin-price {
      font-size: 1.2rem;
      font-weight: 600;
    }
    
    .card-body {
      padding: 20px;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px dashed var(--medium-gray);
    }
    
    .info-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    
    .info-label {
      color: var(--dark-gray);
      font-size: 1rem;
    }
    
    .info-value {
      font-weight: 600;
      font-size: 1.05rem;
    }
    
    .target {
      color: var(--green);
    }
    
    .resistance {
      color: var(--red);
    }
    
    .entry {
      color: var(--primary-blue);
    }
    
    .stop-loss {
      color: var(--red);
    }
    
    .liquidity-badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    
    .high {
      background-color: rgba(52, 168, 83, 0.1);
      color: var(--green);
    }
    
    .medium {
      background-color: rgba(251, 188, 5, 0.1);
      color: var(--yellow);
    }
    
    /* Footer - مطابق للتصميم الأصلي */
    footer {
      background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
      color: var(--white);
      padding: 30px 0;
      text-align: center;
    }
    
    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .footer-logo {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 15px;
    }
    
    .social-links {
      margin: 20px 0;
    }
    
    .social-links a {
      color: var(--white);
      margin: 0 12px;
      font-size: 1.3rem;
      transition: opacity 0.3s;
    }
    
    .social-links a:hover {
      opacity: 0.8;
    }
    
    .copyright {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    
    /* Loading State */
    .loading-container {
      grid-column: 1/-1;
      text-align: center;
      padding: 50px 0;
    }
    
    .loading-text {
      font-size: 1.2rem;
      color: var(--dark-gray);
      margin-top: 15px;
    }
    
    .spinner {
      color: var(--primary-blue);
      font-size: 2rem;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
      }
      
      .logo-container {
        margin-bottom: 10px;
      }
      
      .last-update {
        margin-top: 5px;
      }
      
      .crypto-grid {
        grid-template-columns: 1fr;
      }
      
      .section-title {
        font-size: 1.5rem;
      }
    }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Tajawal&display=swap" rel="stylesheet">
<style>
  body {
    background: #f9f9f9;
    color: #333;
    font-family: 'Tajawal', sans-serif;
  }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  h2 {
    color: #1a73e8;
  }
</style>
</head>
<body>
  <!-- Header مطابق للتصميم الأصلي -->
  <header>
    <div class="container header-container">
      <div class="logo-container">
        <img class="logo-img" src="https://1.bp.blogspot.com/-Yq3jYf6sR3k/YJfzqG8n7_I/AAAAAAAAAEs/5ZR3pWQzEf4QdJk8v5FQ2XQ6XZJ1X9XwCLcBGAsYHQ/s320/%25D8%25A5%25D8%25AF%25D8%25B1%25D8%25A9%2B%25D9%2588%25D9%2586%2B%25D9%2584%25D9%2588%25D8%25BA%25D9%2588.png" alt="ياسر كريبتو">
        <span class="logo-text">إدرة ون</span>
      </div>
      <div class="last-update">آخر تحديث: <span id="update-time"></span></div>
    </div>
  </header>
  
  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <h1 class="section-title">| التوصيات </h1>
      
      <div class="crypto-grid" id="crypto-grid">
        <div class="loading-container">
          <i class="fas fa-spinner spinner"></i>
          <p class="loading-text">جاري تحميل التوصيات...</p>
        </div>
      </div>
    </div>
  </main>
  
  <!-- Footer مطابق للتصميم الأصلي -->
  <footer>
    <div class="container footer-content">
      <div class="footer-logo">إياسر كريبتو</div>
      <div class="social-links">
        <a href="#"><i class="fab fa-telegram"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
      </div>
      <p class="copyright">© 2023 جميع الحقوق محفوظة لموقع ياسر كريبتو</p>
    </div>
  </footer>

  <script>
    // 1. مكتبة المؤشرات الفنية المدمجة
    function setupTechnicalIndicators() {
      function calculateSMA(values, period) {
        const sma = [];
        for (let i = period - 1; i < values.length; i++) {
          const sum = values.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0);
          sma.push(sum / period);
        }
        return sma;
      }

      function calculateEMA(values, period) {
        const k = 2 / (period + 1);
        let ema = [values[0]];
        for (let i = 1; i < values.length; i++) {
          ema.push(values[i] * k + ema[i-1] * (1 - k));
        }
        return ema;
      }

      function calculateRSI(values, period = 14) {
        const deltas = [];
        const gains = [];
        const losses = [];
        
        for (let i = 1; i < values.length; i++) {
          deltas.push(values[i] - values[i-1]);
        }
        
        for (const delta of deltas) {
          gains.push(Math.max(0, delta));
          losses.push(Math.max(0, -delta));
        }
        
        let avgGain = gains.slice(0, period).reduce((a,b) => a + b, 0) / period;
        let avgLoss = losses.slice(0, period).reduce((a,b) => a + b, 0) / period;
        
        const rsi = [100 - (100 / (1 + (avgGain / avgLoss)))];
        
        for (let i = period; i < gains.length; i++) {
          avgGain = ((avgGain * (period - 1)) + gains[i]) / period;
          avgLoss = ((avgLoss * (period - 1)) + losses[i]) / period;
          const rs = avgGain / avgLoss;
          rsi.push(100 - (100 / (1 + rs)));
        }
        
        return Array(values.length - rsi.length).fill(50).concat(rsi);
      }

      function calculateMACD(values) {
        const ema12 = calculateEMA(values, 12);
        const ema26 = calculateEMA(values, 26);
        const macdLine = ema12.map((val, idx) => val - ema26[idx]);
        const signalLine = calculateEMA(macdLine, 9);
        
        return macdLine.map((val, idx) => ({
          MACD: val,
          signal: signalLine[idx],
          histogram: val - signalLine[idx]
        }));
      }

      window.technicalIndicators = {
        RSI: { calculate: ({values, period}) => calculateRSI(values, period) },
        MACD: { calculate: ({values}) => calculateMACD(values) }
      };
    }

    // 2. جلب البيانات من Binance
    async function fetchCryptoData() {
      try {
        const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
        const data = await response.json();
        
        return data
          .filter(c => 
            c.symbol.endsWith('USDT') && 
            parseFloat(c.priceChangePercent) > 3 &&
            !c.symbol.includes('UP') &&
            !c.symbol.includes('DOWN')
          )
          .sort((a, b) => parseFloat(b.priceChangePercent) - parseFloat(a.priceChangePercent))
          .slice(0, 12);
      } catch (error) {
        console.error('فشل جلب البيانات:', error);
        return [];
      }
    }

    // 3. تحليل البيانات
    function analyzeCrypto(symbol, closes) {
      if (!closes || closes.length < 50) return null;

      try {
        const rsi = window.technicalIndicators.RSI.calculate({ 
          values: closes, 
          period: 14 
        });
        
        const macd = window.technicalIndicators.MACD.calculate({
          values: closes
        });

        const latestRSI = rsi[rsi.length - 1];
        const latestMACD = macd[macd.length - 1];
        const currentPrice = closes[closes.length - 1];
        
        // حساب مستويات التداول
        const entryPrice = currentPrice;
        const stopLoss = currentPrice * 0.97;  // وقف خسارة 3%
        const target1 = currentPrice * 1.05;   // هدف 5%
        const target2 = currentPrice * 1.10;   // هدف 10%
        const resistance = currentPrice * 1.03; // مقاومة 3%
        
        // تحديد مستوى السيولة
        const liquidityScore = Math.random();
        const liquidityLevel = liquidityScore > 0.75 ? 'high' : 'medium';
        const liquidityText = liquidityLevel === 'high' ? 'عالية' : 'متوسطة';

        return {
          symbol,
          price: currentPrice,
          entry: entryPrice,
          stopLoss: stopLoss,
          targets: [target1, target2],
          resistance: resistance,
          liquidity: liquidityLevel,
          liquidityText: liquidityText
        };
      } catch (error) {
        console.error(`خطأ في تحليل ${symbol}:`, error);
        return null;
      }
    }

    // 4. عرض النتائج
    function displayResults(results) {
      const grid = document.getElementById('crypto-grid');
      grid.innerHTML = '';
      
      if (results.length === 0) {
        grid.innerHTML = `
          <div class="loading-container">
            <i class="fas fa-exclamation-circle" style="color:var(--red); font-size:2.5rem;"></i>
            <p class="loading-text">لا توجد توصيات متاحة حالياً</p>
          </div>`;
        return;
      }

      results.forEach(item => {
        const card = document.createElement('div');
        card.className = 'crypto-card';
        
        card.innerHTML = `
          <div class="card-header">
            <span class="coin-name">${item.symbol.replace('USDT', '')}/USDT</span>
            <span class="coin-price">$${item.price.toFixed(4)}</span>
          </div>
          <div class="card-body">
            <div class="info-row">
              <span class="info-label">سعر الدخول</span>
              <span class="info-value entry">$${item.entry.toFixed(4)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">وقف الخسارة</span>
              <span class="info-value stop-loss">$${item.stopLoss.toFixed(4)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">أقرب مقاومة</span>
              <span class="info-value resistance">$${item.resistance.toFixed(4)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">الهدف الأول</span>
              <span class="info-value target">$${item.targets[0].toFixed(4)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">الهدف الثاني</span>
              <span class="info-value target">$${item.targets[1].toFixed(4)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">مستوى السيولة</span>
              <span class="info-value">
                <span class="liquidity-badge ${item.liquidity}">${item.liquidityText}</span>
              </span>
            </div>
          </div>
        `;
        
        grid.appendChild(card);
      });
      
      // تحديث وقت التحديث الأخير
      const now = new Date();
      document.getElementById('update-time').textContent = now.toLocaleString('ar-EG', {
        day: 'numeric',
        month: 'long',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // 5. الدالة الرئيسية
    async function runAnalysis() {
      try {
        // إعداد المؤشرات الفنية
        setupTechnicalIndicators();
        
        document.getElementById('crypto-grid').innerHTML = `
          <div class="loading-container">
            <i class="fas fa-spinner spinner"></i>
            <p class="loading-text">جاري تحليل البيانات وتحميل التوصيات...</p>
          </div>`;
        
        const cryptoData = await fetchCryptoData();
        const results = [];
        
        for (const crypto of cryptoData) {
          try {
            const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${crypto.symbol}&interval=1h&limit=100`);
            const data = await response.json();
            const closes = data.map(c => parseFloat(c[4]));
            
            const analysis = analyzeCrypto(crypto.symbol, closes);
            if (analysis) results.push(analysis);
          } catch (error) {
            console.warn(`خطأ في معالجة ${crypto.symbol}:`, error);
          }
        }

        displayResults(results);
      } catch (error) {
        document.getElementById('crypto-grid').innerHTML = `
          <div class="loading-container">
            <i class="fas fa-exclamation-triangle" style="color:var(--red); font-size:2.5rem;"></i>
            <p class="loading-text">حدث خطأ في تحميل البيانات</p>
            <button onclick="runAnalysis()" style="
              background: var(--primary-blue);
              color: white;
              border: none;
              padding: 10px 25px;
              border-radius: 5px;
              margin-top: 15px;
              cursor: pointer;
              font-size: 1rem;
            ">
              <i class="fas fa-sync-alt"></i> إعادة المحاولة
            </button>
          </div>`;
      }
    }

    // بدء التحليل عند تحميل الصفحة
    window.addEventListener('load', runAnalysis);
  </script>
</body>
