<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>📊 توصيات العملات الذكية</title>
  <style>
    /* نفس الأنماط السابقة */
    .error {
      background: #1e1e2d;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.6;
    }
    .error button {
      background: #00e676;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>📈 توصيات العملات الذكية (RSI + MACD + ارتفاع +5%)</h1>
  <div class="grid" id="cardsGrid">جاري التحميل...</div>

  <script>
    // 1. دالة تحميل المكتبة مع حل احتياطي
    function loadTechnicalIndicators() {
      return new Promise((resolve) => {
        if (typeof technicalIndicators !== 'undefined') {
          resolve();
          return;
        }

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/anandanand84/technicalindicators@3.1.1/dist/technicalindicators.min.js';
        script.onload = resolve;
        script.onerror = () => {
          showError('❌ فشل تحميل المكتبة. جرب تحديث الصفحة أو متصفحاً مختلفاً.');
        };
        document.head.appendChild(script);
      });
    }

    // 2. عرض الأخطاء بطريقة أنيقة
    function showError(message) {
      document.getElementById('cardsGrid').innerHTML = `
        <div class="error">
          ${message}<br>
          <button onclick="location.reload()">تحديث الصفحة</button>
        </div>`;
    }

    // 3. الدوال الأخرى (fetchTopMovers, fetchCandles, analyze) تبقى كما هي

    // 4. الدالة الرئيسية المعدلة
    async function runAutoAnalysis() {
      try {
        await loadTechnicalIndicators();
        
        if (typeof technicalIndicators === 'undefined') {
          showError(`
            ❌ المتصفح يحظر تحميل المكتبة.<br>
            جرب <a href="https://cors-anywhere.herokuapp.com/" target="_blank">هذا الرابط</a> أولاً،
            ثم اضغط "Request temporary access".
          `);
          return;
        }

        document.getElementById("cardsGrid").innerHTML = "جاري التحليل...";
        const symbols = await fetchTopMovers();
        
        if (symbols.length === 0) {
          showError("⚠️ لا توجد عملات مؤهلة حالياً");
          return;
        }

        for (let symbol of symbols) {
          const closes = await fetchCandles(symbol);
          analyze(symbol, closes);
        }

        if (document.getElementById("cardsGrid").children.length === 0) {
          showError("⚠️ لا توجد توصيات متاحة حسب المعايير الحالية");
        }
      } catch (error) {
        showError(`❌ خطأ غير متوقع: ${error.message}`);
      }
    }

    window.addEventListener('load', runAutoAnalysis);
  </script>
</body>
</html>
