<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>📊 توصيات العملات الذكية</title>
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: #0a192f;
      color: #e6f1ff;
      margin: 0;
      padding: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: #112240;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .suggestion {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
    }
    .buy { background: #003c2c; color: #00e676; }
    .neutral { background: #1a237e; color: #9fa8da; }
    .error { 
      background: #1e1e2d;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin: 20px auto;
      max-width: 600px;
    }
    .refresh-btn {
      background: #64ffda;
      color: #0a192f;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1 style="text-align: center">📈 توصيات العملات الذكية</h1>
  <div id="cardsGrid">جاري التحميل...</div>

  <script>
    // 1. مكتبة المؤشرات الفنية المدمجة
    function setupTechnicalIndicators() {
      // حساب المتوسط المتحرك البسيط (SMA)
      function calculateSMA(values, period) {
        const sma = [];
        for (let i = period - 1; i < values.length; i++) {
          const sum = values.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0);
          sma.push(sum / period);
        }
        return sma;
      }

      // حساب المتوسط المتحرك الأسي (EMA)
      function calculateEMA(values, period) {
        const k = 2 / (period + 1);
        let ema = [values[0]];
        for (let i = 1; i < values.length; i++) {
          ema.push(values[i] * k + ema[i-1] * (1 - k));
        }
        return ema;
      }

      // حساب مؤشر RSI
      function calculateRSI(values, period = 14) {
        const deltas = [];
        const gains = [];
        const losses = [];
        
        for (let i = 1; i < values.length; i++) {
          deltas.push(values[i] - values[i-1]);
        }
        
        for (const delta of deltas) {
          gains.push(Math.max(0, delta));
          losses.push(Math.max(0, -delta));
        }
        
        let avgGain = gains.slice(0, period).reduce((a,b) => a + b, 0) / period;
        let avgLoss = losses.slice(0, period).reduce((a,b) => a + b, 0) / period;
        
        const rsi = [100 - (100 / (1 + (avgGain / avgLoss)))];
        
        for (let i = period; i < gains.length; i++) {
          avgGain = ((avgGain * (period - 1)) + gains[i]) / period;
          avgLoss = ((avgLoss * (period - 1)) + losses[i]) / period;
          const rs = avgGain / avgLoss;
          rsi.push(100 - (100 / (1 + rs)));
        }
        
        // تعبئة القيم المفقودة بالقيمة المحايدة 50
        return Array(values.length - rsi.length).fill(50).concat(rsi);
      }

      // حساب مؤشر MACD
      function calculateMACD(values) {
        const ema12 = calculateEMA(values, 12);
        const ema26 = calculateEMA(values, 26);
        const macdLine = ema12.map((val, idx) => val - ema26[idx]);
        const signalLine = calculateEMA(macdLine, 9);
        
        return macdLine.map((val, idx) => ({
          MACD: val,
          signal: signalLine[idx],
          histogram: val - signalLine[idx]
        }));
      }

      // تعريض الدوال للاستخدام العام
      window.technicalIndicators = {
        RSI: { calculate: ({values, period}) => calculateRSI(values, period) },
        MACD: { calculate: ({values}) => calculateMACD(values) }
      };
    }

    // 2. جلب البيانات من Binance
    async function fetchCryptoData() {
      try {
        const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
        const data = await response.json();
        
        return data
          .filter(c => 
            c.symbol.endsWith('USDT') && 
            parseFloat(c.priceChangePercent) > 5
          )
          .slice(0, 30);
      } catch (error) {
        console.error('فشل جلب البيانات:', error);
        return [];
      }
    }

    // 3. تحليل البيانات
    function analyzeCrypto(symbol, closes) {
      if (!closes || closes.length < 50) return null;

      try {
        const rsi = window.technicalIndicators.RSI.calculate({ 
          values: closes, 
          period: 14 
        });
        
        const macd = window.technicalIndicators.MACD.calculate({
          values: closes
        });

        const latestRSI = rsi[rsi.length - 1];
        const latestMACD = macd[macd.length - 1];
        const currentPrice = closes[closes.length - 1];

        return {
          symbol,
          rsi: latestRSI,
          macd: latestMACD.MACD,
          signal: latestMACD.signal,
          price: currentPrice
        };
      } catch (error) {
        console.error(`خطأ في تحليل ${symbol}:`, error);
        return null;
      }
    }

    // 4. عرض النتائج
    function displayResults(results) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      
      if (results.length === 0) {
        grid.innerHTML = `
          <div class="error">
            ⚠️ لا توجد عملات مؤهلة حسب المعايير
            <button class="refresh-btn" onclick="runAnalysis()">إعادة المحاولة</button>
          </div>`;
        return;
      }

      results.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const suggestionClass = (item.rsi > 30 && item.rsi < 70) ? 'buy' : 'neutral';
        const suggestionText = (item.rsi > 30 && item.rsi < 70) ? '✅ توصية شراء' : '🟡 محايد';
        
        card.innerHTML = `
          <h2>${item.symbol}</h2>
          <p>السعر: $${item.price.toFixed(4)}</p>
          <p>RSI: ${item.rsi.toFixed(2)}</p>
          <p>MACD: ${item.macd.toFixed(4)}</p>
          <div class="suggestion ${suggestionClass}">${suggestionText}</div>
        `;
        
        grid.appendChild(card);
      });
    }

    // 5. الدالة الرئيسية
    async function runAnalysis() {
      try {
        // إعداد المؤشرات الفنية
        setupTechnicalIndicators();
        
        document.getElementById('cardsGrid').innerHTML = 'جاري تحليل البيانات...';
        
        const cryptoData = await fetchCryptoData();
        const results = [];
        
        for (const crypto of cryptoData) {
          try {
            const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${crypto.symbol}&interval=1h&limit=100`);
            const data = await response.json();
            const closes = data.map(c => parseFloat(c[4]));
            
            const analysis = analyzeCrypto(crypto.symbol, closes);
            if (analysis) results.push(analysis);
          } catch (error) {
            console.warn(`خطأ في معالجة ${crypto.symbol}:`, error);
          }
        }

        displayResults(results);
      } catch (error) {
        document.getElementById('cardsGrid').innerHTML = `
          <div class="error">
            ❌ حدث خطأ غير متوقع:<br>
            ${error.message}
            <button class="refresh-btn" onclick="runAnalysis()">إعادة المحاولة</button>
          </div>`;
      }
    }

    // بدء التحليل عند تحميل الصفحة
    window.addEventListener('load', runAnalysis);
  </script>
</body>
</html>
